<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101719" />
    <title>Omega · 工作持续发生</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside id="sidebar"></aside>
    <main>
      <header>
        <button id="menu-toggle" type="button" class="mobile-only icon-button" aria-label="打开列表" aria-controls="conversation-drawer" aria-expanded="false"></button>
        <div class="header-title"></div>
        <span id="devices"></span>
        <span id="mobile-new-host"></span>
      </header>
      <section id="group-view" hidden></section>
      <div id="error" role="alert"></div>
      <section id="messages" aria-label="会话消息"></section>
      <div class="latest-bar"></div>
      <section id="approvals"></section>
      <form id="composer"></form>
      <p class="footnote">OMEGA · 同一个工作空间，随处接续</p>
    </main>

    <!-- Native containers keep only their platform-owned connection forms. -->
    <dialog id="setup">
      <form method="dialog" id="connect-form">
        <div class="caption">连接工作空间</div>
        <h2>欢迎来到 Omega</h2>
        <p>输入服务器的个人访问密钥。它只会保存在当前设备的安全存储中。</p>
        <label>访问密钥<input id="token" type="password" autocomplete="off" required /></label>
        <button>连接 →</button>
      </form>
    </dialog>
    <dialog id="key-settings" aria-labelledby="key-title">
      <h2 id="key-title">连接设置</h2>
      <section id="key-summary">
        <p>访问密钥已配置，当前设备已连接。</p>
        <p id="key-status">无需重复设置；只有更换密钥时才需要修改。</p>
        <div class="dialog-actions"><button id="key-close" type="button" class="secondary">关闭</button><button id="edit-key" type="button">修改密钥</button></div>
      </section>
      <form id="key-form" hidden>
        <p>保存后立即生效，重启也会保留。其他设备需要用新密钥重新连接。</p>
        <label>新密钥<input id="new-key" type="password" autocomplete="new-password" minlength="8" maxlength="256" required placeholder="至少 8 位，可自行填写" /></label>
        <div class="key-options"><label><input id="show-key" type="checkbox" />显示密钥</label><button id="generate-key" type="button" class="secondary">随机生成</button></div>
        <p id="key-error" role="alert"></p>
        <div class="dialog-actions"><button id="key-cancel" type="button" class="secondary">取消</button><button id="save-key" type="submit">保存密钥</button></div>
      </form>
    </dialog>
    <dialog id="conversation-drawer" aria-label="列表"></dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
