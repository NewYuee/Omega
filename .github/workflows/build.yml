name: Build Omega

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run web:build
      - name: Install browser for UI regression
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  android:
    name: Android Release APK (ARM64)
    if: github.actor == github.repository_owner && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.created == true
    needs: verify
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      OMEGA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      OMEGA_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      OMEGA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The obsolete 'tools' package is no longer available.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Restore stable Android signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/omega-release.jks"
          echo "OMEGA_ANDROID_KEYSTORE=$RUNNER_TEMP/omega-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Release APK
        run: npm run mobile:android:build:local-release -- --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: omega-android-arm64-release
          path: src-tauri/gen/android/app/build/outputs/apk/**/Omega-aarch64-release-local-signed.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release assets
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.created == true
    needs: [verify, android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omega-android-arm64-release
          path: artifacts/android
      - uses: actions/download-artifact@v4
        with:
          name: omega-macos
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        with:
          name: omega-windows-x64
          path: artifacts/windows
      - name: Validate and publish installers
        shell: bash
        run: |
          set -euo pipefail
          # Explicitly require every platform before creating or changing a release.
          for spec in 'android:*.apk' 'macos:*.dmg' 'macos:*.zip' 'windows:*.exe'; do
            platform="${spec%%:*}"
            pattern="${spec#*:}"
            test -n "$(find "artifacts/$platform" -type f -name "$pattern" -size +0c -print -quit)"
          done
          mapfile -d '' assets < <(find artifacts -type f \( -name '*.apk' -o -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0)
          # Fail rather than silently overwrite files with duplicate names.
          declare -A names
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            if [[ -n "${names[$name]:-}" ]]; then
              echo "Duplicate release asset: $name" >&2
              exit 1
            fi
            names[$name]=1
          done
          # An API/auth/network failure is not evidence that a release is absent.
          releases="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')"
          if ! grep -Fxq -- "$RELEASE_TAG" <<< "$releases"; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Omega $RELEASE_TAG" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false

  desktop:
    name: Desktop package (${{ matrix.name }})
    if: github.actor == github.repository_owner && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.created == true
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac
            artifact: omega-macos
            files: |
              release/*.dmg
              release/*.zip
          - name: Windows
            os: windows-latest
            args: --win --x64
            artifact: omega-windows-x64
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run desktop:package -- ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
