name: Build Omega

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run web:build

  android:
    name: Android Release APK (ARM64)
    needs: verify
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      OMEGA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      OMEGA_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      OMEGA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Restore stable Android signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/omega-release.jks"
          echo "OMEGA_ANDROID_KEYSTORE=$RUNNER_TEMP/omega-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Release APK
        run: npm run mobile:android:build:local-release -- --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: omega-android-arm64-release
          path: src-tauri/gen/android/app/build/outputs/apk/**/Omega-aarch64-release-local-signed.apk
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop package (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac
            artifact: omega-macos
            files: |
              release/*.dmg
              release/*.zip
          - name: Windows
            os: windows-latest
            args: --win --x64
            artifact: omega-windows-x64
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run desktop:package -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
